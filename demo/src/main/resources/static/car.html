<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CARSTUDIO | Urus SE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 22px;
            letter-spacing: 5px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            background:
                radial-gradient(circle at center, rgba(40,70,100,0.25), transparent 50%),
                #050505;
        }

        .hero-content {
            width: 100%;
            max-width: 1200px;
            text-align: center;
        }

        .label {
            font-size: 12px;
            letter-spacing: 5px;
            opacity: 0.6;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(45px, 8vw, 100px);
            letter-spacing: 8px;
            margin-bottom: 35px;
        }

        .hero img {
            width: min(900px, 90%);
            max-height: 500px;
            object-fit: contain;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.8));
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            max-width: 900px;
            margin: 0 auto;
            border-top: 1px solid rgba(255,255,255,0.15);
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .spec {
            padding: 25px;
            text-align: center;
        }

        .spec strong {
            display: block;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .spec span {
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.5;
        }

        .gallery {
            padding: 100px 6%;
        }

        .gallery h2 {
            font-size: 35px;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery-grid img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            background: #111;
        }

        .configure {
            text-align: center;
            padding: 80px 20px 120px;
        }

        .configure h2 {
            font-size: 40px;
            margin-bottom: 25px;
        }

        .configure button {
            padding: 18px 45px;
            background: white;
            color: black;
            border: none;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        .configure button:hover {
            background: #b8dfff;
            transform: translateY(-3px);
        }

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .hero {
                padding: 30px 15px;
            }

            .specs {
                grid-template-columns: 1fr;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-grid img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">CARSTUDIO</div>

    <a href="index.html" class="back">
        ← BACK TO COLLECTION
    </a>
</nav>

<section class="hero">

    <div class="hero-content">

        <div class="label">
            LAMBORGHINI
        </div>

        <h1>URUS SE</h1>

        <img
            src="images/cars/urus-se/front.jpg"
            alt="Lamborghini Urus SE"
        >

        <div class="specs">

            <div class="spec">
                <strong>800 CV</strong>
                <span>POWER</span>
            </div>

            <div class="spec">
                <strong>3.4 SEC</strong>
                <span>0–100 KM/H</span>
            </div>

            <div class="spec">
                <strong>HYBRID</strong>
                <span>POWERTRAIN</span>
            </div>

        </div>

    </div>

</section>

<section class="gallery">

    <h2>THE URUS SE</h2>

    <div class="gallery-grid">

        <img
            src="images/cars/urus-se/side.jpg"
            alt="Urus SE Side"
        >

        <img
            src="images/cars/urus-se/rear.jpg"
            alt="Urus SE Rear"
        >

        <img
            src="images/cars/urus-se/top.jpg"
            alt="Urus SE Top"
        >

        <img
            src="images/cars/urus-se/wheel.jpg"
            alt="Urus SE Wheel"
        >

        <img
            src="images/cars/urus-se/interior.jpg"
            alt="Urus SE Interior"
        >

    </div>

</section>

<section class="configure">

    <h2>CREATE YOUR URUS SE</h2>

    <p style="opacity:0.6; margin-bottom:30px;">
        Configure every detail of your car.
    </p>

    <button onclick="location.href='customize.html?car=urus-se'">
        START CUSTOMIZATION →
    </button>

</section>

</body>
</html>
